name: 빌드 및 GHCR로 푸시

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'GHCR에 푸시하기'
        type: boolean
        default: false
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'entrypoint.sh'

env:
  PUSH_TO_REGISTRY: ${{ github.event_name == 'push' || inputs.push_to_registry }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 빌드할 타겟 목록
        target: [web, scheduler]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: env.PUSH_TO_REGISTRY == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: echo "value=$(date --utc '+%y.%-m')-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/premiere-relay-archive/${{ matrix.target }}
          # 참고: 여기에 명시되지 않았어도 metadata-action이 기본적으로 주요 레이블을 채웁니다.
          labels: |
            org.opencontainers.image.title=premiere-relay-archive/${{ matrix.target }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }},priority=10
            type=sha

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_TO_REGISTRY == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max