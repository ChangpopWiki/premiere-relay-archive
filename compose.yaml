services:
  web:
    image: ghcr.io/changpopwiki/premiere-relay-archive/web:latest
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./var/data:/app/data
      - ./var/logs:/app/logs

  scheduler:
    image: ghcr.io/changpopwiki/premiere-relay-archive/scheduler:latest
    restart: unless-stopped
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./var/data:/app/data
      - ./var/logs:/app/logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./var/data:/app/data
    networks:
      chp_proxy:
        aliases:
          - premiere-relay-archive
      default:

networks:
  chp_proxy:
    external: true