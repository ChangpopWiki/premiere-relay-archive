services:
  web:
    build:
      context: .
      target: web
    expose:
      - "9000"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  scheduler:
    build:
      context: .
      target: scheduler
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/app/data
    networks:
      chp_proxy:
        aliases:
          - premiere-relay-archive
      default:

networks:
  chp_proxy:
    external: true