services:
  web:
    build:
      context: .
      target: web
    expose:
      - "8080"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  scheduler:
    build:
      context: .
      target: scheduler
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  caddy:
    image: caddy:latest
    ports:
      - "${CADDY_PORT:-8081}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/app/data